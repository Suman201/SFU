apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: native-sfu-shared-assets
  namespace: native-sfu
spec:
  accessModes:
    - ReadWriteMany
  # Replace with a production RWX filesystem class such as EFS, Filestore, or
  # Azure Files. Local-path and ReadWriteOnce volumes are not multi-node safe.
  storageClassName: rwx-file
  resources:
    requests:
      storage: 250Gi
