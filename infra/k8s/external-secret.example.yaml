apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: native-sfu-secrets
  namespace: native-sfu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: native-sfu-secrets
    creationPolicy: Owner
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: native-sfu/production/mongodb-uri
    - secretKey: REDIS_URL
      remoteRef:
        key: native-sfu/production/redis-url
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: native-sfu/production/jwt-access-secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: native-sfu/production/jwt-refresh-secret
    - secretKey: OPERATIONS_TOKEN
      remoteRef:
        key: native-sfu/production/operations-token
    - secretKey: TURN_SECRET
      remoteRef:
        key: native-sfu/production/turn-secret
    - secretKey: WEBHOOK_SECRET_ENCRYPTION_KEY
      remoteRef:
        key: native-sfu/production/webhook-encryption-key
    - secretKey: PIPE_CLUSTER_SECRET
      remoteRef:
        key: native-sfu/production/pipe-cluster-secret
