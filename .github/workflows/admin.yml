name: Product and admin CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      NG_BUILD_MAX_WORKERS: '2'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install media verification tools
        timeout-minutes: 8
        run: |
          # Only Ubuntu media/browser packages are needed. The runner's unused
          # Microsoft feed can return 403 and block all subsequent apt updates.
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ] && grep -Eq 'https?://packages[.]microsoft[.]com/' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          echo 'Acquire::Retries "2"; Acquire::http::Timeout "30"; Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-sfu-ci-network > /dev/null
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install headless browsers and Linux dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build learning portal, admin and backend dependencies
        run: npm run build:admin-ci
      - name: Detect public contract drift
        run: npm run contracts:check
      - name: Verify release documentation and environment inventory
        run: npm run release:check
      - name: Verify uploads against a real malware scanner
        run: npm run test:p1:uploads
      - name: Run worker lifecycle regressions
        run: npm run test:p1:workers
      - name: Run admin unit tests
        run: |
          export CHROME_BIN="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:admin:unit
      - name: Run all frontend unit tests
        run: |
          export CHROME_BIN="$(node -p "require('playwright').chromium.executablePath()")"
          npm run test:p0:frontend
      - name: Run the complete backend regression suite
        run: npm run test:p0:backend
      - name: Start isolated Mongo replica set and Redis
        run: node scripts/admin-ci-services.cjs up
      - name: Run real backend admin and payment scenarios
        run: npm run test:admin:integration
      - name: Run Chromium and WebKit admin acceptance
        env:
          ADMIN_COMPLETION_OUTPUT: ${{ github.workspace }}/reports/admin-ci/screenshots/operations
          ADMIN_PERMISSION_UI_OUTPUT: ${{ github.workspace }}/reports/admin-ci/screenshots/permissions
          PAYMENT_MERGE_OUTPUT: ${{ github.workspace }}/reports/admin-ci/screenshots/payments
        run: npm run test:admin:browser
      - name: Verify booking earnings, currency payouts and historical finance review
        run: npm run test:finance:browser
      - name: Verify public desktop download availability and release boundaries
        run: npm run test:desktop:distribution:browser
      - name: Verify English support, CMS media and paid promotions
        run: npm run test:expansion:browser
      - name: Verify account settings and customer billing in all browsers
        run: npm run test:account:browser
      - name: Build classroom acceptance frontend
        run: npm run build:p0:classroom
      - name: Verify backup restore and monitoring delivery
        run: npm run test:p0:operations
      - name: Start isolated classroom services
        run: node scripts/p0-ci-services.cjs up
      - name: Verify production payment index provisioning
        run: npm run test:p0:setup
      - name: Verify paid learning, media, recording, Q&A, calendar and invoice delivery
        run: npm run test:p0:browser
      - name: Verify P1 private threads, multi-node isolation, native pipes and bounded recovery
        id: p1_acceptance
        run: npm run test:p1:browser
      - name: Verify P2 publication history, contact, audit, policies and accessibility
        if: ${{ success() || (failure() && steps.p1_acceptance.outcome == 'failure') }}
        run: npm run test:p2:browser
      - name: Verify Google and Apple sign-in in Chromium, Firefox and WebKit
        run: npm run test:social:browser
      - name: Verify account recovery, mail retry, expiry and cross-node session revocation
        run: npm run test:recovery:browser
      - name: Collect test service diagnostics
        if: always()
        run: |
          mkdir -p reports/admin-ci
          node scripts/admin-ci-services.cjs logs > reports/admin-ci/services.log
          node scripts/p0-ci-services.cjs logs > reports/admin-ci/p0-services.log
      - name: Preserve reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: admin-ci-evidence
          path: |
            reports/admin-ci/
            test-results/admin/
            reports/desktop-distribution/
            test-results/desktop-distribution/
            reports/expansion/
            test-results/expansion/
            reports/account/
            test-results/account/
            reports/finance/
            test-results/finance/
            reports/p0/
            test-results/p0/
            reports/p1/
            reports/recovery/
            test-results/recovery/
            reports/social/
            test-results/social/
            reports/p2/
            test-results/p2/
            test-results/p1/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove isolated test services
        if: always()
        run: |
          node scripts/admin-ci-services.cjs down
          node scripts/p0-ci-services.cjs down
