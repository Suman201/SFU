<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sapiovian — Online classes and teachers</title>
    <meta name="description" content="Find teachers, join interactive live classes, and keep learning with shared whiteboards, recordings and resources on Sapiovian.">
    <base href="/">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="alternate icon" href="/assets/brand/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png">
    <meta name="application-name" content="Sapiovian">
    <meta name="apple-mobile-web-app-title" content="Sapiovian">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/env.js"></script>
    <script>
      (() => {
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem('native-sfu-theme');
        } catch {
          storedTheme = null;
        }
        const theme = storedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <sfu-root></sfu-root>
  </body>
</html>
