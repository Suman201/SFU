<sfu-auth-layout [role]="expectedRole" [title]="title" [subtitle]="subtitle">
  <form class="auth-panel" [formRoot]="form" (submit)="submit($event)">
    <header>
      <div>
        <p class="eyebrow">Welcome back</p>
        <h1>{{ title }}</h1>
      </div>
      <a [routerLink]="alternateLoginPath">{{ alternateRole === 'teacher' ? 'I’m a teacher' : 'I’m a student' }}</a>
    </header>

    <label>
      Email
      <input [formField]="form.email" autocomplete="email">
    </label>

    <div class="password-field">
      <label for="login-password">Password</label>
      <div class="password-input-wrap">
        <input
          id="login-password"
          [type]="showPassword() ? 'text' : 'password'"
          [formField]="form.password"
          autocomplete="current-password"
        >
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword()"
        >
          <span aria-hidden="true">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </span>
        </button>
      </div>
    </div>

    <div class="remember-row">
      <label class="checkbox-row">
        <input type="checkbox" [checked]="rememberMe()" (change)="updateRememberMe($event)">
        <span>Remember me</span>
      </label>
    </div>

    <button class="primary" type="submit" [disabled]="form().invalid() || busy()">
      {{ busy() ? 'Signing in…' : 'Log in' }}
    </button>

    @if (error() || auth.sessionNotice()) {
      <p class="error" role="alert">{{ error() || auth.sessionNotice() }}</p>
    }

    <p class="secondary-link">
      New here? <a routerLink="/register">Create a student account</a>
    </p>
  </form>
</sfu-auth-layout>
