server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mount only the reviewed release bundle as a read-only volume here.
  location ^~ /desktop-downloads/releases/ {
    alias /srv/desktop-distribution/releases/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    disable_symlinks on;
  }
  location ^~ /desktop-downloads/stable/ {
    alias /srv/desktop-distribution/stable/;
    autoindex off;
    default_type text/yaml;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    disable_symlinks on;
  }
  location /desktop-downloads/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
