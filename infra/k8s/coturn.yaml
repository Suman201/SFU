apiVersion: v1
kind: ConfigMap
metadata:
  name: coturn-config
  namespace: native-sfu
data:
  turnserver.conf: |
    listening-port=3478
    tls-listening-port=5349
    listening-ip=0.0.0.0
    fingerprint
    use-auth-secret
    min-port=49160
    max-port=49259
    stale-nonce=600
    total-quota=1200
    user-quota=12
    max-bps=8000000
    no-multicast-peers
    no-loopback-peers
    no-tlsv1
    no-tlsv1_1
    no-cli
    log-file=stdout
    simple-log
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
  namespace: native-sfu
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: coturn
  template:
    metadata:
      labels:
        app: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: coturn
              topologyKey: kubernetes.io/hostname
      containers:
        - name: coturn
          image: coturn/coturn:4
          args:
            - -c
            - /etc/coturn/turnserver.conf
            - --realm=$(TURN_REALM)
            - --external-ip=$(TURN_EXTERNAL_IP)
            - --static-auth-secret=$(TURN_SECRET)
            - --cert=/etc/coturn/tls/tls.crt
            - --pkey=/etc/coturn/tls/tls.key
          env:
            - name: TURN_REALM
              value: sfu.example.com
            - name: TURN_EXTERNAL_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: native-sfu-secrets
                  key: TURN_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: tls
              mountPath: /etc/coturn/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 3478
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3478
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: coturn-config
        - name: tls
          secret:
            secretName: native-sfu-turn-tls
